[tox]
requires =
    tox>=4.11
    tox-uv>=1.11
env_list =
    lint
    pytools
min_version = 4.11

[testenv:lint]
description = Lint Python-based documentation tooling
skip_install = true
# Pinned: ruff's default rule set changes between minor releases, so an open
# range silently turns a green pipeline red on an unrelated commit. Bump
# deliberately, with the resulting fixes in the same change.
deps = ruff==0.16.0
commands =
    ruff check {toxinidir}/scripts {toxinidir}/tools {toxinidir}/tests/python
    ruff format --check {toxinidir}/scripts {toxinidir}/tools {toxinidir}/tests/python

[testenv:pytools]
description = Test Python helper tooling
skip_install = true
deps = pytest>=8.0.0
commands =
    pytest {toxinidir}/tests/python
