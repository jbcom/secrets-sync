name: Dependency Review

on:
  pull_request:

permissions: {}

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Sourcey is the explicitly selected documentation tool and is
          # AGPL-3.0-only. Keep the gate for other strong-copyleft additions.
          deny-licenses: GPL-2.0-only, GPL-3.0-only
